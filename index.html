<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terran Explorer - Half Earth</title>
  <style>
    :root {
      --sky: #8ed8ff;
      --sea: #52c8ff;
      --sea-deep: #1d7ec7;
      --grass: #9adf6d;
      --grass-2: #7ecf5d;
      --mountain: #b18a5d;
      --mountain-2: #7d623f;
      --snow: #eff7ff;
      --forest: #3c8d51;
      --panel: rgba(255,255,255,0.7);
      --ink: #1d314a;
      --shadow: #12355c;
      --button: #ffd768;
      --button-red: #ff8d6d;
      --button-green: #83df88;
      --button-dark: #d59827;
      --button-red-dark: #d8644d;
      --button-green-dark: #4ea861;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #8ed8ff 0%, #dff7ff 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: min(1120px, 96vw);
      height: min(760px, 96vh);
      border: 6px solid var(--shadow);
      border-radius: 18px;
      background: linear-gradient(to bottom, #9fe4ff 0%, #dcefff 100%);
      box-shadow: 0 14px 0 rgba(17, 53, 89, 0.18);
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .topbar {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      z-index: 25;
      background: rgba(255,255,255,0.2);
      border-bottom: 5px solid var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.2rem);
      letter-spacing: 1px;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.4);
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 4px solid var(--shadow);
      border-radius: 12px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.7) inset, 0 6px 0 rgba(0,0,0,0.15);
      font-weight: 800;
      transition: transform 0.12s ease;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.7) inset, 0 3px 0 rgba(0,0,0,0.12);
    }

    .mini-btn {
      background: var(--button);
      color: var(--ink);
      padding: 8px 14px;
      font-size: 0.8rem;
    }

    .big-btn {
      background: var(--button-green);
      color: var(--ink);
      padding: 16px 28px;
      font-size: 1.1rem;
      min-width: 190px;
    }

    /* Earth screen */
    #earth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 70px;
    }

    .earth-wrap {
      position: relative;
      width: min(62vw, 620px);
      height: min(62vw, 620px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #earthCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
      display: block;
      cursor: grab;
      image-rendering: pixelated;
      filter: saturate(1.1);
      touch-action: none;
    }

    #earthCanvas.dragging { cursor: grabbing; }

    .rotation-controls {
      position: absolute;
      left: 20px;
      bottom: 20px;
      display: flex;
      gap: 12px;
      z-index: 20;
    }

    .rotation-btn {
      background: var(--button);
      color: var(--ink);
      padding: 10px 18px;
      font-size: 0.9rem;
    }

    .hint {
      position: absolute;
      right: 20px;
      bottom: 20px;
      background: rgba(255,255,255,0.72);
      border: 4px solid var(--shadow);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      z-index: 20;
    }

    /* Menu screen */
    #menu-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #8fd9ff 0%, #dff6ff 100%);
    }

    .menu-panel {
      width: min(680px, 80vw);
      background: rgba(255,255,255,0.3);
      border: 6px solid var(--shadow);
      border-radius: 20px;
      padding: 28px 26px 30px;
      text-align: center;
      box-shadow: 0 12px 0 rgba(32,74,111,0.12);
    }

    .menu-panel h2 {
      margin: 0 0 12px;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      letter-spacing: 2px;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.45);
    }

    .menu-panel p {
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .planet-demo {
      width: 220px;
      height: 220px;
      margin: 10px auto 22px;
      border-radius: 50%;
      border: 7px solid var(--shadow);
      background: linear-gradient(135deg, #5ec7ff 0%, #2d95ea 35%, #0d5fa5 70%, #1d4578 100%);
      box-shadow: inset -18px -18px 0 rgba(0,0,0,0.12), 0 15px 0 rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
      animation: floatPlanet 4s ease-in-out infinite;
    }

    .planet-demo::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6), transparent 18%),
        radial-gradient(circle at 60% 64%, rgba(123, 219, 129, 0.9), transparent 18%),
        radial-gradient(circle at 72% 38%, rgba(123, 219, 129, 0.75), transparent 18%),
        radial-gradient(circle at 35% 70%, rgba(123, 219, 129, 0.78), transparent 18%);
    }

    .planet-demo::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 32%, transparent 42%);
    }

    /* Interior scenes */
    #interior-screen {
      display: flex;
      flex-direction: column;
    }

    .scene-head {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255,255,255,0.35);
      border-bottom: 5px solid var(--shadow);
      gap: 10px;
    }

    .scene-head h3 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 2rem);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.35);
    }

    .scene {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .sea-scene { background: linear-gradient(to bottom, #7ad9ff 0%, #3b9ce3 32%, #1a4f97 100%); }
    .volcano-scene { background: linear-gradient(to bottom, #4d2d2d 0%, #8c3d31 42%, #1f1818 100%); }
    .mountain-scene { background: linear-gradient(to bottom, #c9ecff 0%, #edf7ff 58%, #d9efff 100%); }
    .forest-scene { background: linear-gradient(to bottom, #7bd0a4 0%, #5fb781 34%, #356c4d 100%); }

    .feature {
      position: absolute;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease;
    }

    .feature:hover {
      transform: translateY(-2px) scale(1.05);
    }

    .fish {
      width: 54px;
      height: 24px;
      background: linear-gradient(90deg, #f2d36a, #f7a650);
      border: 4px solid var(--shadow);
      border-radius: 18px 12px 12px 18px;
      position: relative;
    }

    .fish::before {
      content: "";
      position: absolute;
      right: -12px;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 14px solid #ffda74;
    }

    .fish::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 50%;
      width: 6px;
      height: 6px;
      background: var(--shadow);
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .shell {
      width: 32px;
      height: 24px;
      background: linear-gradient(180deg, #f7dfbg, #dab071);
      border: 4px solid var(--shadow);
      border-radius: 50% 50% 42% 42%;
      position: relative;
    }

    .shell::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 12px;
      height: 10px;
      border: 3px solid rgba(0,0,0,0.15);
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .coral {
      width: 42px;
      height: 68px;
      background: linear-gradient(180deg, #ff8f67, #d74843);
      border: 4px solid var(--shadow);
      clip-path: polygon(50% 0%, 100% 30%, 78% 100%, 22% 100%, 0% 30%);
      position: relative;
    }

    .seaplant {
      width: 16px;
      height: 82px;
      background: linear-gradient(180deg, #87f2a0, #42b66e);
      border: 4px solid var(--shadow);
      border-radius: 18px;
      position: relative;
    }

    .bubble {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      border: 3px solid rgba(255,255,255,0.8);
      animation: bubbleRise 4s ease-in-out infinite;
    }

    .rock {
      width: 52px;
      height: 34px;
      background: linear-gradient(180deg, #8d8e97, #5e646e);
      border: 4px solid var(--shadow);
      clip-path: polygon(12% 100%, 0% 70%, 20% 15%, 40% 0%, 70% 14%, 100% 0%, 100% 62%, 88% 100%);
    }

    .wave {
      position: absolute;
      left: -10%;
      right: -10%;
      height: 110px;
      border-top: 5px solid rgba(255,255,255,0.6);
      background: rgba(125, 206, 255, 0.32);
      border-radius: 50% 50% 0 0;
      animation: waveShift 5s ease-in-out infinite alternate;
    }

    .wave.w1 { bottom: 180px; }
    .wave.w2 { bottom: 110px; animation-delay: 0.7s; }
    .wave.w3 { bottom: 44px; animation-delay: 1.4s; }

    .volcano-mountain {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 420px;
      height: 300px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #563a39 0%, #251c1d 100%);
      border: 6px solid var(--shadow);
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      z-index: 1;
    }

    .crater {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 180px;
      height: 120px;
      transform: translateX(-50%);
      background: radial-gradient(circle at 50% 40%, #ffb454 0%, #ed5d2b 30%, #3d1717 60%, #120a0a 100%);
      border: 5px solid var(--shadow);
      border-radius: 52% 48% 46% 54%;
      z-index: 2;
      overflow: hidden;
    }

    .lava {
      position: absolute;
      inset: 16% 10% 8% 10%;
      background: radial-gradient(circle at 50% 35%, #ffd46d 0%, #ff8c3f 25%, #ff5a2a 55%, rgba(145,15,15,0.8) 100%);
      border-radius: 50%;
      animation: lavaPulse 1.4s ease-in-out infinite alternate;
    }

    .smoke {
      width: 48px;
      height: 78px;
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.7), rgba(255,255,255,0.15) 52%, transparent 72%);
      border-radius: 50%;
      filter: blur(2px);
      animation: smokeRise 4s ease-in-out infinite;
    }

    .magma {
      width: 80px;
      height: 52px;
      background: linear-gradient(180deg, #ffba59, #ff552d);
      border: 4px solid var(--shadow);
      border-radius: 30% 30% 36% 36%;
    }

    .volcanic-rock {
      width: 60px;
      height: 38px;
      background: linear-gradient(180deg, #886058, #4c3735);
      border: 4px solid var(--shadow);
      clip-path: polygon(12% 100%, 0% 62%, 25% 10%, 60% 0%, 100% 18%, 90% 100%);
    }

    .mountain-peak {
      position: absolute;
      left: 50%;
      bottom: 12%;
      width: 360px;
      height: 210px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #b0c6d8, #7b8e9f);
      border: 6px solid var(--shadow);
      clip-path: polygon(0% 100%, 22% 56%, 34% 36%, 52% 14%, 67% 38%, 78% 62%, 100% 100%);
      z-index: 1;
    }

    .snow-cap {
      position: absolute;
      left: 50%;
      bottom: 34%;
      width: 180px;
      height: 90px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ffffff, #dfeeff);
      border: 5px solid var(--shadow);
      clip-path: polygon(0% 100%, 22% 28%, 42% 13%, 54% 0%, 64% 14%, 78% 26%, 100% 100%);
      z-index: 2;
    }

    .mountain-cloud {
      width: 130px;
      height: 36px;
      background: linear-gradient(180deg, #f6fdff, #c9ebff);
      border: 4px solid var(--shadow);
      border-radius: 22px;
      position: absolute;
      animation: cloudFloat 12s ease-in-out infinite alternate;
    }

    .mountain-cloud::before,
    .mountain-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
      border: 4px solid var(--shadow);
    }

    .mountain-cloud::before {
      width: 34px;
      height: 34px;
      left: 16px;
      top: -20px;
    }

    .mountain-cloud::after {
      width: 42px;
      height: 40px;
      right: 18px;
      top: -18px;
    }

    .mountain-tree {
      width: 20px;
      height: 54px;
      background: linear-gradient(180deg, #a67754, #724e2f);
      border: 4px solid var(--shadow);
      border-radius: 6px;
      position: relative;
    }

    .mountain-tree::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -30px;
      width: 62px;
      height: 52px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #72d48a, #409d5b);
      border: 4px solid var(--shadow);
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .water-source {
      width: 100px;
      height: 44px;
      background: linear-gradient(180deg, #76dcff, #34a0de);
      border: 4px solid var(--shadow);
      border-radius: 50% 50% 44% 44%;
      position: relative;
    }

    .forest-tree {
      width: 20px;
      height: 56px;
      background: linear-gradient(180deg, #a67654, #714d2d);
      border: 4px solid var(--shadow);
      border-radius: 6px;
      position: relative;
    }

    .forest-tree::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -38px;
      width: 80px;
      height: 70px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #69d180, #2da060);
      border: 4px solid var(--shadow);
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .forest-plant {
      width: 28px;
      height: 18px;
      background: linear-gradient(180deg, #8af0a5, #4db96b);
      border: 4px solid var(--shadow);
      border-radius: 8px 8px 12px 12px;
      position: relative;
    }

    .flower {
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at center, #fff8d0 0 26%, #ff75b7 26% 56%, #ff5f8b 56% 100%);
      border: 4px solid var(--shadow);
      border-radius: 50%;
      position: relative;
    }

    .animal {
      width: 54px;
      height: 26px;
      background: linear-gradient(90deg, #b4835d, #7e4e38);
      border: 4px solid var(--shadow);
      border-radius: 20px 14px 14px 18px;
      position: relative;
    }

    .animal::before {
      content: "";
      position: absolute;
      right: 7px;
      top: 8px;
      width: 7px;
      height: 7px;
      background: var(--shadow);
      border-radius: 50%;
    }

    .mushroom {
      width: 26px;
      height: 40px;
      background: linear-gradient(180deg, #ff9aa3, #d76a75);
      border: 4px solid var(--shadow);
      border-radius: 12px 12px 18px 18px;
      position: relative;
    }

    .mushroom::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -15px;
      width: 36px;
      height: 18px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f7d5dd, #ebacb5);
      border: 4px solid var(--shadow);
      border-radius: 50% 50% 18% 18%;
    }

    .fact-modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 22, 35, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .fact-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .fact-card {
      width: min(520px, 80vw);
      background: linear-gradient(180deg, #ebfbff, #d7f0ff);
      border: 6px solid var(--shadow);
      border-radius: 20px;
      padding: 18px 18px 20px;
      box-shadow: 0 14px 0 rgba(0,0,0,0.18);
    }

    .fact-card h4 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink);
    }

    .fact-content {
      background: rgba(255,255,255,0.72);
      border: 4px solid var(--shadow);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.7;
      color: var(--ink);
      text-align: center;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
    }

    .close-fact {
      margin-top: 16px;
      width: 100%;
      background: var(--button-red);
      color: var(--ink);
      padding: 12px 18px;
      font-size: 1rem;
    }

    @keyframes floatPlanet {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes waveShift {
      0% { transform: translateX(-2%) scaleY(1); }
      100% { transform: translateX(2%) scaleY(1.08); }
    }

    @keyframes bubbleRise {
      0% { transform: translateY(22px) scale(0.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-140px) scale(1.2); opacity: 0; }
    }

    @keyframes lavaPulse {
      0% { transform: scale(0.96); filter: brightness(0.95); }
      100% { transform: scale(1.05); filter: brightness(1.1); }
    }

    @keyframes smokeRise {
      0% { opacity: 0; transform: translate(0,18px) scale(0.7); }
      25% { opacity: 0.7; }
      100% { opacity: 0; transform: translate(12px,-90px) scale(1.5); }
    }

    @keyframes cloudFloat {
      0% { transform: translateX(-12px); }
      100% { transform: translateX(12px); }
    }

    @media (max-width: 760px) {
      .rotation-controls {
        left: 12px;
        bottom: 12px;
      }

      .hint {
        right: 12px;
        bottom: 12px;
        padding: 6px 10px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="menu-screen" class="screen active">
      <div class="menu-panel">
        <h2>Terran Explorer</h2>
        <p>Explore Earth's amazing environments, learn Earth science facts, and travel across a rotating half-world.</p>
        <div class="planet-demo"></div>
        <button class="big-btn" id="startBtn">Start Adventure</button>
      </div>
    </div>

    <div id="earth-screen" class="screen">
      <div class="topbar">
        <h1>Terran Explorer</h1>
        <button class="mini-btn" id="menuBtn">Main Menu</button>
      </div>

      <div class="earth-wrap">
        <canvas id="earthCanvas" width="620" height="620"></canvas>
      </div>

      <div class="rotation-controls">
        <button class="rotation-btn" id="leftBtn">◀ Left</button>
        <button class="rotation-btn" id="rightBtn">Right ▶</button>
      </div>

      <div class="hint">Drag or swipe to rotate</div>
    </div>

    <div id="interior-screen" class="screen">
      <div class="scene-head">
        <button class="mini-btn" id="backBtn">← Back</button>
        <h3 id="sceneTitle">Sea</h3>
        <div style="width: 80px;"></div>
      </div>
      <div id="scene" class="scene sea-scene"></div>
    </div>
  </div>

  <div id="factModal" class="fact-modal" aria-live="polite">
    <div class="fact-card">
      <h4 id="factTitle">Fish</h4>
      <div class="fact-content" id="factText">Fact text goes here.</div>
      <button class="close-fact" id="closeFactBtn">Close</button>
    </div>
  </div>

  <script>
    // ===============================================================
    // Terran Explorer - Half Earth + Exploration Game
    // ===============================================================

    const canvas = document.getElementById('earthCanvas');
    const ctx = canvas.getContext('2d');
    const sceneEl = document.getElementById('scene');
    const sceneTitle = document.getElementById('sceneTitle');
    const factModal = document.getElementById('factModal');
    const factTitle = document.getElementById('factTitle');
    const factText = document.getElementById('factText');

    const earthState = {
      rotation: 0,
      dragging: false,
      pointerStart: null,
      cat: { x: 54, y: 67 }
    };

    const regionData = {
      sea: { x: 0.68, y: 0.71, label: 'Sea / Ocean' },
      volcano: { x: 0.34, y: 0.45, label: 'Volcano' },
      mountain: { x: 0.70, y: 0.22, label: 'Mountain' },
      forest: { x: 0.80, y: 0.72, label: 'Forest' }
    };

    const factMap = {
      fish: { title: 'Fish', text: 'Fish have gills that help them breathe underwater, and they live in oceans, rivers, and lakes all over Earth.' },
      shell: { title: 'Shell', text: 'Shells protect many sea animals, like snails and clams, from predators and from drying out on land.' },
      coral: { title: 'Coral', text: 'Corals are tiny living animals that build reefs, which provide shelter and food for many sea creatures.' },

    };

    const sceneConfigs = {
      sea: {

    // ===============================================================
    // Earth drawing helpers
    // ===============================================================

    function buildWorldMap() {
      const mapCanvas = document.createElement('canvas');
      mapCanvas.width = 640;
      mapCanvas.height = 320;
      const m = mapCanvas.getContext('2d');

      m.fillStyle = '#52c8ff';
      m.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

      function blob(x, y, w, h, color) {
        m.fillStyle = color;
        m.beginPath();
        m.ellipse(x, y, w, h, 0, 0, 2 * Math.PI);
        m.fill();
      }

      // Large green continents
      blob(105, 145, 135, 85, '#97d65e');
      blob(245, 120, 150, 90, '#84cf6a');
      blob(430, 165, 115, 70, '#9bdd67');
      blob(520, 130, 95, 70, '#8aca60');

      // Mountain / brown patches
      blob(200, 105, 24, 18, '#b78a63');
      blob(325, 95, 28, 20, '#8b7456');
      blob(488, 160, 22, 18, '#a98464');

      // Coastline highlights
      m.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 18; i++) {
        m.fillRect(18 + i * 28, 50 + (i % 5) * 18, 12, 10);
      }

      return mapCanvas;
    }

    const worldMap = buildWorldMap();

    function drawPixelEarth() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2 + 16;
      const r = Math.min(w, h) * 0.42;

      ctx.clearRect(0, 0, w, h);

      // Sky aura behind earth
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(cx, cy - 4, r + 12, 0, Math.PI * 2);
      ctx.fill();

      // Clip to a top half-sphere (half-earth reference shape)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - r, cy);
      ctx.arc(cx, cy, r, Math.PI, 0, false);
      ctx.closePath();
      ctx.clip();

      // Draw ocean base and map texture
      const textureOffset = (earthState.rotation % 1) * worldMap.width;
      ctx.fillStyle = '#58c8ff';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

      for (let dx = -worldMap.width; dx < worldMap.width * 2; dx += worldMap.width) {
        ctx.drawImage(
          worldMap,
          (textureOffset + dx) % (worldMap.width * 2),
          0,
          worldMap.width,
          worldMap.height,
          cx - r,
          cy - r,
          r * 2,
          r * 2
        );
      }

      // Shade the bottom as if in shadow
      const shadow = ctx.createRadialGradient(cx - 60, cy + 18, 10, cx - 10, cy + 40, r + 60);
      shadow.addColorStop(0, 'rgba(0,0,0,0)');
      shadow.addColorStop(0.7, 'rgba(0,0,0,0.10)');
      shadow.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = shadow;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

      // Highlight top-left glow
      const shine = ctx.createRadialGradient(cx - 90, cy - 90, 10, cx - 70, cy - 70, r * 0.9);
      shine.addColorStop(0, 'rgba(255,255,255,0.5)');
      shine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      ctx.restore();

      // Earth rim
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#132d45';
      ctx.stroke();

      // Inner cutaway edge to suggest half-planet
      ctx.beginPath();
      ctx.moveTo(cx - r, cy);
      ctx.arc(cx, cy, r, Math.PI, 0, false);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#1a3d5f';
      ctx.stroke();

      // Draw cat as a simple pixel sprite on surface
      drawCatOnEarth(cx, cy, r);

      // Draw region markers on the surface in a simplified 2D placement
      drawRegionMarker('sea', 'Sea', cx + r * 0.58, cy + r * 0.42, 68, 34);
      drawRegionMarker('volcano', 'Volcano', cx - r * 0.62, cy - r * 0.02, 70, 34);
      drawRegionMarker('mountain', 'Mountain', cx + r * 0.28, cy - r * 0.48, 80, 34);
      drawRegionMarker('forest', 'Forest', cx + r * 0.52, cy + r * 0.12, 66, 34);
    }

    function drawRegionMarker(key, label, x, y, w, h) {
      const hitRadius = 26;
      regionData[key].hit = { x, y, r: hitRadius };

      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.strokeStyle = '#18385f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - h / 2, w, h, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#f7cc52';
      ctx.beginPath();
      ctx.arc(x - w / 2 - 8, y, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#182c43';
      ctx.font = 'bold 14px Trebuchet MS';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 5);
    }

    function drawCatOnEarth(cx, cy, r) {
      const x = cx + r * 0.12 + (earthState.cat.x - 50) * (r * 0.55 / 50);
      const y = cy + r * 0.18 + (earthState.cat.y - 50) * (r * 0.45 / 50);

      const size = 20;
      ctx.save();
      ctx.translate(x, y);

      // body
      ctx.fillStyle = '#f4c589';
      ctx.fillRect(-10, -4, 20, 15);
      ctx.fillStyle = '#e1a55e';
      ctx.fillRect(-7, -8, 14, 6);

      // ears
      ctx.fillStyle = '#f4c589';
      ctx.fillRect(-7, -12, 4, 6);
      ctx.fillRect(3, -12, 4, 6);

      // eyes
      ctx.fillStyle = '#0f1e2f';
      ctx.fillRect(-4, -1, 3, 3);
      ctx.fillRect(3, -1, 3, 3);

      // nose
      ctx.fillStyle = '#de8d5d';
      ctx.fillRect(-1, 2, 2, 2);

      // paws
      ctx.fillStyle = '#f4c589';
      ctx.fillRect(-8, 10, 4, 4);
      ctx.fillRect(4, 10, 4, 4);

      ctx.restore();
    }

    // ===============================================================
    // Interaction / rotation / selection
    // ===============================================================

    function screenToCanvasPos(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function getClickedRegion(x, y) {
      for (const [key, data] of Object.entries(regionData)) {
        if (data.hit && Math.hypot(x - data.hit.x, y - data.hit.y) < data.hit.r) {
          return key;
        }
      }
      return null;
    }

    canvas.addEventListener('pointerdown', (event) => {
      const pos = screenToCanvasPos(event);
      const region = getClickedRegion(pos.x, pos.y);
      if (region) {
        openRegion(region);
        return;
      }

      earthState.dragging = true;
      earthState.pointerStart = { x: event.clientX, y: event.clientY, rotation: earthState.rotation };
      canvas.classList.add('dragging');
    });

    window.addEventListener('pointermove', (event) => {
      if (!earthState.dragging || !earthState.pointerStart) return;
      const dx = event.clientX - earthState.pointerStart.x;
      earthState.rotation = earthState.pointerStart.rotation + dx / 280;
      drawPixelEarth();
    });

    window.addEventListener('pointerup', () => {
      earthState.dragging = false;
      earthState.pointerStart = null;
      canvas.classList.remove('dragging');
    });

    canvas.addEventListener('pointerleave', () => {
      earthState.dragging = false;
      earthState.pointerStart = null;
      canvas.classList.remove('dragging');
    });

    function rotateEarth(dir) {
      earthState.rotation += dir * 0.18;
      drawPixelEarth();
    }

    document.getElementById('leftBtn').addEventListener('click', () => rotateEarth(-1));
    document.getElementById('rightBtn').addEventListener('click', () => rotateEarth(1));

    // ===============================================================
    // Environment exploration
    // ===============================================================

    function openRegion(region) {
      const config = sceneConfigs[region];
      if (!config) return;

      sceneTitle.textContent = config.title;
      sceneEl.className = 'scene ' + config.className;
      sceneEl.innerHTML = config.html;

      sceneEl.querySelectorAll('.feature').forEach((element) => {
        element.addEventListener('click', () => {
          const key = element.dataset.key;
          const info = factMap[key];
          if (info) {
            factTitle.textContent = info.title;
            factText.textContent = info.text;
            factModal.classList.add('show');
          }
        });
      });

      document.getElementById('earth-screen').classList.remove('active');
      document.getElementById('interior-screen').classList.add('active');
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('interior-screen').classList.remove('active');
      document.getElementById('earth-screen').classList.add('active');
      factModal.classList.remove('show');
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('earth-screen').classList.remove('active');
      document.getElementById('menu-screen').classList.add('active');
      factModal.classList.remove('show');
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('menu-screen').classList.remove('active');
      document.getElementById('earth-screen').classList.add('active');
    });

    document.getElementById('closeFactBtn').addEventListener('click', () => {
      factModal.classList.remove('show');
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') rotateEarth(-1);
      if (key === 'arrowright' || key === 'd') rotateEarth(1);
      if (key === 'arrowup' || key === 'w') {
        earthState.cat.y = Math.max(15, earthState.cat.y - 4);
        drawPixelEarth();
      }
      if (key === 'arrowdown' || key === 's') {
        earthState.cat.y = Math.min(84, earthState.cat.y + 4);
        drawPixelEarth();
      }
      if (key === 'enter') {
        const candidate = Object.keys(regionData).find((keyName) => {
          const p = regionData[keyName];
          return Math.abs(earthState.cat.x - (p.x * 100)) < 10 && Math.abs(earthState.cat.y - (p.y * 100)) < 12;
        });
        if (candidate) openRegion(candidate);
      }
    });

    // ===============================================================
    // Startup
    // ===============================================================

    document.getElementById('earth-screen').classList.add('active');
    drawPixelEarth();
  </script>
