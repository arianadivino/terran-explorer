<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotating Half Earth</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #7ad2ff, #d9f6ff 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      perspective: 1200px;
      width: 600px;
      height: 600px;
    }

    #earth {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #5cc4ff 0%, #2c8de8 30%, #0a5fb8 60%, #1d417e 100%);
      border: 8px solid #0d1a2a;
      box-shadow: inset -20px -20px 0 rgba(0,0,0,0.15), 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      cursor: grab;
      transform-style: preserve-3d;
    }

    #earth.dragging {
      cursor: grabbing;
    }

    /* Earth surface with continents */
    #earth::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        /* Green landmasses */
        radial-gradient(circle at 35% 30%, rgba(119, 215, 132, 0.85) 0 9%, transparent 9% 14%),
        radial-gradient(circle at 62% 46%, rgba(122, 215, 132, 0.86) 0 12%, transparent 12% 17%),
        radial-gradient(circle at 22% 62%, rgba(122, 219, 137, 0.9) 0 9%, transparent 9% 15%),
        radial-gradient(circle at 68% 72%, rgba(112, 205, 128, 0.9) 0 12%, transparent 12% 19%),
        radial-gradient(circle at 49% 62%, rgba(95, 188, 116, 0.8) 0 10%, transparent 10% 18%);
      z-index: 2;
    }

    /* Shine effect */
    #earth::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.3), transparent 22%);
      pointer-events: none;
      z-index: 3;
    }

    /* Shadow effect */
    #earth .shadow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), transparent 40%, rgba(0,0,0,0.2));
      pointer-events: none;
      z-index: 4;
    }

    .info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #0d1a2a;
      border-radius: 12px;
      padding: 12px 20px;
      text-align: center;
      font-weight: bold;
      color: #1d3d77;
      font-size: 14px;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .container {
        width: 400px;
        height: 400px;
      }

      .info {
        font-size: 12px;
        padding: 10px 15px;
      }
    }

    @media (max-width: 480px) {
      .container {
        width: 320px;
        height: 320px;
      }

      #earth {
        border-width: 6px;
      }

      .info {
        font-size: 11px;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="earth">
      <div class="shadow"></div>
    </div>
  </div>

  <div class="info">Drag to rotate the Earth</div>

  <script>
    const earth = document.getElementById("earth");
    let rotX = 0;
    let rotY = 0;
    let pointerStart = null;
    let isDragging = false;

    earth.addEventListener("pointerdown", (e) => {
      isDragging = true;
      earth.classList.add("dragging");
      pointerStart = {
        x: e.clientX,
        y: e.clientY,
        startRotX: rotX,
        startRotY: rotY
      };
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging || !pointerStart) return;

      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;

      rotY = pointerStart.startRotY + dx * 0.5;
      rotX = Math.max(-30, Math.min(30, pointerStart.startRotX - dy * 0.5));

      earth.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });

    window.addEventListener("pointerup", () => {
      isDragging = false;
      earth.classList.remove("dragging");
      pointerStart = null;
    });

    window.addEventListener("touchmove", (e) => {
      if (isDragging) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
